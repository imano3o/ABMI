spring:
  application:
    name: abmi
  datasource:
    url: jdbc:h2:file:./data/abmi;AUTO_SERVER=TRUE
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

# fake = FakeSapClient (no SAP mock needed), http = HttpSapClient (SAP mock must be running)
sap:
  mode: http
  base-url: http://localhost:8081
